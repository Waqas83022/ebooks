<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: normal; src: url("fonts/CormorantGaramond-500.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 600; font-style: normal; src: url("fonts/CormorantGaramond-600.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: italic; src: url("fonts/CormorantGaramond-500-italic.woff2") format("woff2"); }

  :root {
    --ink: #13213b;
    --ink-deep: #0c1629;
    --ivory: #f2e8d5;
    --copper: #c4804f;
  }
  html, body { margin: 0; padding: 0; background: var(--ink-deep); }
  .cover {
    position: relative;
    width: 1600px;
    height: 2560px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--ink-deep) 0%, var(--ink) 55%, #172946 100%);
    color: var(--ivory);
    font-family: "Cormorant", Georgia, serif;
  }
  svg.art { position: absolute; inset: 0; }
  .title {
    position: absolute;
    top: 230px; left: 0; right: 0;
    text-align: center;
    line-height: 1;
  }
  .title .big {
    display: block;
    font-weight: 600;
    font-size: 214px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .title .small {
    display: block;
    font-style: italic;
    font-weight: 500;
    font-size: 116px;
    margin: 26px 0 24px 0;
  }
  .rule {
    width: 180px; height: 4px; margin: 76px auto 0 auto;
    background: var(--copper);
  }
  .subtitle {
    position: absolute;
    top: 1010px; left: 150px; right: 150px;
    text-align: center;
    font-style: italic;
    font-weight: 500;
    font-size: 84px;
    line-height: 1.18;
  }
  .author {
    position: absolute;
    top: 2230px; left: 0; right: 0;
    text-align: center;
    font-family: "Inter", "Liberation Sans", sans-serif;
    font-weight: 500;
    font-size: 60px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .tagline {
    position: absolute;
    top: 2378px; left: 120px; right: 120px;
    text-align: center;
    font-style: italic;
    font-weight: 500;
    font-size: 46px;
    color: rgba(242, 232, 213, 0.78);
  }
</style>
</head>
<body>
<div class="cover">
  <svg class="art" width="1600" height="2560" viewBox="0 0 1600 2560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f2e8d5" stop-opacity="0"/>
        <stop offset="0.45" stop-color="#f2e8d5" stop-opacity="0.3"/>
        <stop offset="1" stop-color="#f2e8d5" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- a faint sweep of wind crossing the flight path -->
    <path d="M -40 1560 C 360 1500, 700 1640, 1040 1700 S 1480 1760, 1660 1700" fill="none" stroke="url(#sweep)" stroke-width="3"/>
    <path d="M -40 1640 C 380 1590, 720 1720, 1060 1780 S 1500 1830, 1660 1780" fill="none" stroke="url(#sweep)" stroke-width="2"/>
    <path d="M 80 1480 C 440 1430, 760 1550, 1080 1610 S 1460 1660, 1620 1620" fill="none" stroke="url(#sweep)" stroke-width="1.6"/>

    <!-- small, off-center target, far away -->
    <g transform="translate(1290,1930)" fill="none" stroke="#f2e8d5" stroke-opacity="0.6" stroke-width="3">
      <circle r="38"/>
      <circle r="21"/>
      <circle r="6" fill="#f2e8d5" fill-opacity="0.6" stroke="none"/>
    </g>

    <!-- one copper arrow, mid-flight, not yet arrived -->
    <g transform="translate(250,1560) rotate(16)">
      <line x1="0" y1="0" x2="760" y2="0" stroke="#c4804f" stroke-width="10" stroke-linecap="round"/>
      <path d="M 744 -26 L 830 0 L 744 26 L 758 0 Z" fill="#c4804f"/>
      <g fill="#c4804f">
        <path d="M 4 -2 L -46 -30 L -28 -2 Z"/>
        <path d="M 4 2 L -46 30 L -28 2 Z"/>
        <path d="M 40 -2 L -6 -28 L 10 -2 Z" fill-opacity="0.8"/>
        <path d="M 40 2 L -6 28 L 10 2 Z" fill-opacity="0.8"/>
      </g>
    </g>
  </svg>

  <div class="title">
    <span class="big">The Archer</span>
    <span class="small">and the</span>
    <span class="big">Wind</span>
    <div class="rule"></div>
  </div>
  <div class="subtitle">How to Keep Going<br>When Hard Work Isn&#8217;t Enough</div>
  <div class="author">Muhammad Waqas</div>
  <div class="tagline">Hard Work, Luck, Destiny, and the Hope That Holds Them Together</div>
</div>
</body>
</html>
