description: >
  A practical guide to reducing distractions, overcoming procrastination and
  making steady progress on the goals that matter, without turning life into an
  endless work schedule. Twenty short chapters explain why attention slips and
  how to take it back: the feelings behind procrastination, phones and social
  media, daydreaming and overthinking, deep work, priorities, planning, habits,
  sleep and rest, with separate guidance for students, employees, business
