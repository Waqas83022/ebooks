<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  :root { --night:#101c29; --navy:#1b3047; --cream:#f3eadb; --red:#c8402f; --steel:#8fa3b8; }
  html, body { margin:0; padding:0; background:var(--night); }
  .cover { position:relative; width:1600px; height:2560px; overflow:hidden; color:var(--cream);
           font-family:Inter, "Liberation Sans", sans-serif;
           background:radial-gradient(1400px 1200px at 70% 58%, #213a55 0%, #15263a 45%, var(--night) 100%); }
  svg.art { position:absolute; inset:0; }
  .kicker { position:absolute; top:150px; left:130px; font-size:52px; font-weight:700; letter-spacing:0.22em;
            text-transform:uppercase; color:var(--steel); }
  .ai { position:absolute; top:205px; left:112px; font-size:560px; line-height:1; font-weight:900;
        letter-spacing:-0.04em; color:var(--cream); }
  .ai span { color:var(--red); }
  .for { position:absolute; top:790px; left:132px; font-size:140px; font-weight:800; line-height:1.0;
         letter-spacing:-0.01em; text-transform:uppercase; }
  .for small { display:block; font-size:72px; font-weight:600; letter-spacing:0.18em; color:var(--steel); margin-bottom:22px; }
  .rule { position:absolute; top:1205px; left:132px; width:220px; height:14px; background:var(--red); }
  .subtitle { position:absolute; top:1265px; left:132px; width:860px; font-size:64px; line-height:1.22; font-weight:500; }
  .subtitle b { font-weight:800; }
  .wins { position:absolute; top:1720px; left:132px; font-size:46px; font-weight:600; line-height:1.55; color:#d9cfbf; }
  .wins i { font-style:normal; color:var(--red); font-weight:900; margin-right:18px; }
  .badge { position:absolute; left:132px; right:132px; top:2040px; border-top:4px solid rgba(243,234,219,0.35);
           border-bottom:4px solid rgba(243,234,219,0.35); padding:34px 0; font-size:50px; font-weight:600;
           letter-spacing:0.02em; text-align:center; color:var(--cream); }
  .badge span { color:var(--red); padding:0 18px; }
  .author { position:absolute; top:2300px; left:0; right:0; text-align:center; font-size:66px; font-weight:700;
            letter-spacing:0.28em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="cover">
  <svg class="art" width="1600" height="2560" viewBox="0 0 1600 2560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="pole"><rect x="1192" y="1375" width="166" height="415" rx="16"/></clipPath>
      <linearGradient id="shine" x1="0" x2="1">
        <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
        <stop offset="0.35" stop-color="#fff" stop-opacity="0.18"/>
        <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
      </linearGradient>
    </defs>

    <!-- chat bubble around the pole -->
    <path d="M 1110 1250 h 330 a 60 60 0 0 1 60 60 v 510 a 60 60 0 0 1 -60 60 h -180 l -110 120 l 20 -120 h -60 a 60 60 0 0 1 -60 -60 v -510 a 60 60 0 0 1 60 -60 z"
          fill="none" stroke="#f3eadb" stroke-width="16" stroke-linejoin="round"/>
    <!-- barber pole -->
    <circle cx="1275" cy="1318" r="26" fill="#f3eadb"/>
    <rect x="1170" y="1335" width="210" height="48" rx="24" fill="#f3eadb"/>
    <rect x="1170" y="1785" width="210" height="48" rx="24" fill="#f3eadb"/>
    <rect x="1192" y="1375" width="166" height="415" rx="16" fill="#f3eadb"/>
    <g clip-path="url(#pole)">
      <g transform="rotate(-32 1275 1580)">
        <rect x="950" y="1140" width="700" height="44" fill="#c8402f"/>
        <rect x="950" y="1232" width="700" height="44" fill="#1b3047"/>
        <rect x="950" y="1324" width="700" height="44" fill="#c8402f"/>
        <rect x="950" y="1416" width="700" height="44" fill="#1b3047"/>
        <rect x="950" y="1508" width="700" height="44" fill="#c8402f"/>
        <rect x="950" y="1600" width="700" height="44" fill="#1b3047"/>
        <rect x="950" y="1692" width="700" height="44" fill="#c8402f"/>
        <rect x="950" y="1784" width="700" height="44" fill="#1b3047"/>
        <rect x="950" y="1876" width="700" height="44" fill="#c8402f"/>
        <rect x="950" y="1968" width="700" height="44" fill="#1b3047"/>
      </g>
      <rect x="1192" y="1375" width="166" height="415" fill="url(#shine)"/>
    </g>
    <!-- circuit traces -->
    <g stroke="#8fa3b8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 1500 1420 h 40"/>
      <path d="M 1500 1560 h 60"/>
      <path d="M 1500 1700 h 40"/>
      <path d="M 1360 1250 v -60 h 110 v -50"/>
      <path d="M 1180 1250 v -45"/>
    </g>
    <g fill="#8fa3b8" opacity="0.9">
      <circle cx="1470" cy="1128" r="14"/>
      <circle cx="1180" cy="1195" r="12"/>
    </g>
  </svg>

  <div class="kicker">No tech skills needed</div>
  <div class="ai">A<span>I</span></div>
  <div class="for"><small>for</small>Barbershop<br>Owners</div>
  <div class="rule"></div>
  <div class="subtitle">Fill empty chairs,<br><b>cut no&#8209;shows</b>, and<br>win back your time<br>with ChatGPT and<br>simple AI tools</div>
  <div class="wins"><i>&#10003;</i>Never miss a booking<br><i>&#10003;</i>Fill quiet weekdays<br><i>&#10003;</i>Earn honest reviews</div>
  <div class="badge">100 prompts<span>·</span>ready scripts<span>·</span>worksheets</div>
  <div class="author">Muhammad Waqas</div>
</div>
</body>
</html>
