<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:2560px;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:#f5efe4;
  background:linear-gradient(180deg,#0f1a2e 0%,#15233c 48%,#2a2a3c 74%,#6a3d1c 100%);position:relative}
.kicker{position:absolute;top:170px;left:130px;right:130px;font-size:42px;font-weight:700;letter-spacing:.16em;color:#f2a93b;text-transform:uppercase;line-height:1.35}
.title{position:absolute;top:340px;left:122px;right:100px;font-weight:900;letter-spacing:-.035em;line-height:.9}
.the{font-size:130px;font-weight:700;letter-spacing:-.01em;color:#f5efe4;display:block;margin-bottom:24px}
.big{font-size:262px;display:block}
.af{color:#f2a93b}
.sub{position:absolute;top:1105px;left:130px;right:150px;font-size:70px;line-height:1.2;font-weight:500;color:#e9e1d3}
.cal{position:absolute;left:130px;right:130px;top:1560px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:18px;margin-bottom:16px}
.days div{text-align:center;font-size:40px;font-weight:700;color:#9fb0c8;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:118px 118px 118px;gap:18px}
.c{border-radius:18px;border:3px solid #3a4c69}
.d{background:#26375a;border-color:#26375a}
.hi{background:#f2a93b;border-color:#f2a93b;color:#14213a;font-weight:900;font-size:58px;display:flex;align-items:center;justify-content:center}
.legend{margin-top:30px;font-size:40px;color:#c9d2df;font-weight:500}
.legend b{color:#f2a93b}
.author{position:absolute;bottom:150px;left:130px;right:130px;font-size:78px;font-weight:700;letter-spacing:.14em;color:#f5efe4;text-transform:uppercase}
.rule{position:absolute;bottom:290px;left:130px;width:220px;height:8px;background:#f2a93b;border-radius:4px}
</style></head>
<body>
<div class="kicker">An employee's guide to a legitimate<br>AI side business</div>
<div class="title"><span class="the">The</span><span class="big af">After-Five</span><span class="big">Business</span></div>
<div class="sub">Build a small AI-assisted service on five hours a week, without risking your day job</div>
<div class="cal">
 <div class="days"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
 <div class="grid">
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c hi">2h</div><div class="c"></div>
  <div class="c d"></div><div class="c d"></div><div class="c d"></div><div class="c d"></div><div class="c d"></div><div class="c"></div><div class="c"></div>
  <div class="c"></div><div class="c hi">2h</div><div class="c"></div><div class="c hi">1h</div><div class="c"></div><div class="c"></div><div class="c"></div>
 </div>
 <div class="legend">Your job keeps the days. <b>Five hours</b> are yours.</div>
</div>
<div class="rule"></div>
<div class="author">Muhammad Waqas</div>
</body></html>
