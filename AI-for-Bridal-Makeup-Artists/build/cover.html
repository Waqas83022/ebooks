<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: normal; src: url("fonts/CormorantGaramond-500.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 600; font-style: normal; src: url("fonts/CormorantGaramond-600.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: italic; src: url("fonts/CormorantGaramond-500-italic.woff2") format("woff2"); }
  :root { --plum:#2b2230; --plum2:#3a2d3f; --ivory:#fbf3ec; --blush:#e9c4bb; --rose:#c98a80; --gold:#c9a46a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:2560px; overflow:hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, var(--plum2) 0%, var(--plum) 70%); color: var(--ivory); font-family: Inter, sans-serif; position:relative; }
  .frame { position:absolute; inset:56px; border:3px solid rgba(201,164,106,.55); }
  .kicker { position:absolute; top:210px; width:100%; text-align:center; font-weight:700; letter-spacing:.32em; font-size:64px; color: var(--gold); }
  .title { position:absolute; top:300px; width:100%; text-align:center; font-family:Cormorant, serif; font-weight:600; font-size:250px; line-height:.9; color: var(--ivory); }
  .title em { font-style:italic; font-weight:500; color: var(--blush); }
  .rule { position:absolute; top:1110px; left:50%; width:260px; margin-left:-130px; height:4px; background: var(--gold); }
  .sub { position:absolute; top:1170px; left:180px; right:180px; text-align:center; font-size:62px; line-height:1.3; color:#efdcd6; font-weight:400; }
  .art { position:absolute; left:0; right:0; top:1490px; height:760px; }
  .author { position:absolute; bottom:150px; width:100%; text-align:center; font-family:Cormorant, serif; font-weight:600; font-size:104px; letter-spacing:.06em; color: var(--ivory); }
</style></head>
<body>
  <div class="frame"></div>
  <div class="kicker">AI FOR</div>
  <div class="title">Bridal<br>Makeup<br><em>Artists</em></div>
  <div class="rule"></div>
  <div class="sub">A practical booking system for faster replies, accurate quotes and calm wedding mornings</div>
  <svg class="art" viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d9d1"/><stop offset="1" stop-color="#c98a80"/></linearGradient>
      <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8824a"/><stop offset=".5" stop-color="#ecd29f"/><stop offset="1" stop-color="#a8824a"/></linearGradient>
      <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7c3b9"/><stop offset=".5" stop-color="#f6e1da"/><stop offset="1" stop-color="#d9aea3"/></linearGradient>
    </defs>
    <!-- chat bubbles -->
    <g>
      <rect x="430" y="60" width="560" height="150" rx="56" fill="#fbf3ec"/>
      <path d="M480 200 L450 262 L540 205 Z" fill="#fbf3ec"/>
      <text x="710" y="152" text-anchor="middle" font-family="Inter" font-size="50" fill="#2b2230">Are you free Oct 10?</text>
      <rect x="700" y="290" width="680" height="150" rx="56" fill="#c98a80"/>
      <path d="M1330 430 L1360 492 L1270 435 Z" fill="#c98a80"/>
      <text x="1040" y="382" text-anchor="middle" font-family="Inter" font-size="50" font-weight="600" fill="#fbf3ec">Booked. Ready by 11:15.</text>
    </g>
    <!-- brushes -->
    <g transform="translate(250 420) rotate(-24)">
      <path d="M0 0 C -46 -70 -40 -170 0 -230 C 40 -170 46 -70 0 0 Z" fill="url(#bristle)"/>
      <rect x="-26" y="0" width="52" height="70" fill="url(#ferrule)"/>
      <rect x="-20" y="70" width="40" height="290" rx="20" fill="url(#handle)"/>
    </g>
    <g transform="translate(380 450) rotate(-8)">
      <path d="M0 0 C -30 -50 -26 -120 0 -160 C 26 -120 30 -50 0 0 Z" fill="url(#bristle)"/>
      <rect x="-18" y="0" width="36" height="60" fill="url(#ferrule)"/>
      <rect x="-14" y="60" width="28" height="260" rx="14" fill="url(#handle)"/>
    </g>
    <!-- timeline -->
    <g transform="translate(700 600)">
      <line x1="0" y1="40" x2="700" y2="40" stroke="#c9a46a" stroke-width="5"/>
      <circle cx="0" cy="40" r="16" fill="#c9a46a"/>
      <circle cx="175" cy="40" r="16" fill="#c9a46a"/>
      <circle cx="350" cy="40" r="16" fill="#c9a46a"/>
      <circle cx="525" cy="40" r="16" fill="#c9a46a"/>
      <circle cx="700" cy="40" r="22" fill="#fbf3ec" stroke="#c9a46a" stroke-width="6"/>
      <text x="0" y="112" text-anchor="middle" font-family="Inter" font-size="34" fill="#e9c4bb">Reply</text>
      <text x="175" y="112" text-anchor="middle" font-family="Inter" font-size="34" fill="#e9c4bb">Quote</text>
      <text x="350" y="112" text-anchor="middle" font-family="Inter" font-size="34" fill="#e9c4bb">Trial</text>
      <text x="525" y="112" text-anchor="middle" font-family="Inter" font-size="34" fill="#e9c4bb">Timeline</text>
      <text x="700" y="112" text-anchor="middle" font-family="Inter" font-size="34" fill="#e9c4bb">Wedding</text>
    </g>
  </svg>
  <div class="author">MUHAMMAD WAQAS</div>
</body></html>
